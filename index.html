<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Room ♥ 🐾 레트로 픽셀 다마고치 고양이 육성</title>
  <meta name="description" content="레트로 픽셀 다마고치 내에서 귀여운 픽셀 고양이를 돌보고 방을 꾸미는 웹 게임 & Arduino 연동 샌드박스">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand-container">
      <span class="brand-logo">🐱</span>
      <h1 class="brand-title">Cat Room ♥</h1>
      <button id="catNameBadge" class="cat-name-badge" title="고양이 이름 수정">나비</button>
    </div>
    
    <div class="header-actions">
      <button id="btnSerialConnect" class="header-action-btn" title="Arduino Web Serial 연동">
        <span id="serialStatusDot" class="status-dot disconnected"></span>
        <span>🔌 Arduino 연결</span>
      </button>

      <button id="btnOpenDecoration" class="header-action-btn" title="방 꾸미기 슬롯">
        <span>🛋️ 방 꾸미기</span>
      </button>

      <button id="btnCaptureRoom" class="header-action-btn" title="포토 카드 캡처">
        <span>📸 방 캡처</span>
      </button>

      <button id="btnResetData" class="header-action-btn" title="데이터 초기화">
        <span>⚙️ 초기화</span>
      </button>
    </div>
  </header>

  <!-- 100vh Dashboard Grid Layout -->
  <main class="dashboard-grid">
    
    <!-- Left Sidebar: Virtual Sensor Debug List (Redundant Care Panel Removed) -->
    <aside class="sidebar-panel">
      <div class="panel-card">
        <div class="panel-title">
          <span>🧪 가상 센서 테스트</span>
        </div>
        <div class="virtual-grid">
          <button id="vbtnSlowApproach" class="virtual-btn">🚶 천천히 접근</button>
          <button id="vbtnFastApproach" class="virtual-btn">🏃 갑자기 접근</button>
          <button id="vbtnPersonLeft" class="virtual-btn">👋 사용자 떠남</button>
          <button id="vbtnPetShort" class="virtual-btn">🖐️ 짧게 쓰다듬기</button>
          <button id="vbtnPetLong" class="virtual-btn">🖐️ 오래 쓰다듬기</button>
          <button id="vbtnFeed" class="virtual-btn">🍽️ 밥 주기</button>
          <button id="vbtnLightBright" class="virtual-btn">☀️ 방 밝게 하기</button>
          <button id="vbtnLightDark" class="virtual-btn">🌙 방 어둡게 하기</button>
        </div>
      </div>
    </aside>

    <!-- Center Stage: Spacious 3D Glossy Tamagotchi Shell -->
    <section class="center-tamagotchi-stage">
      <div class="tamagotchi-shell-3d">
        <div class="tamagotchi-heart-hook"></div>
        <div class="tamagotchi-title-text">Cat Room</div>

        <!-- LCD Screen Frame (Fitted 100% inside shell) -->
        <div class="tamagotchi-screen-frame">
          <div id="speechBubble" class="speech-bubble-overlay">
            <span id="speechBubbleText">반가워요! 당신의 관심이 필요해요.</span>
          </div>

          <div id="roomCanvasContainer" class="room-stage-container">
            <!-- Room SVG & Pixel Cat Injected by JS -->
          </div>
        </div>

        <!-- 4 Matched Tamagotchi Shell Buttons -->
        <div class="tamagotchi-4buttons-row">
          <button id="btnShellFeed" class="shell-4btn feed" title="1: 밥 주기">🍽️</button>
          <button id="btnShellPet" class="shell-4btn pet" title="2: 쓰다듬기">🖐️</button>
          <button id="btnShellPlay" class="shell-4btn play" title="3: 놀아주기">🏀</button>
          <button id="btnShellSleep" class="shell-4btn sleep" title="4: 재우기">🌙</button>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Vertical Cat State Metrics HUD -->
    <aside class="sidebar-panel">
      <div class="panel-card">
        <div class="panel-title">
          <span>📊 고양이 상태</span>
          <span id="catBehaviorTag" style="font-size:12px; color:var(--primary-pink);">💬 평온함</span>
        </div>

        <div class="metrics-vertical-list">
          <div class="metric-item">
            <div class="metric-header">
              <span>🐟 배고픔</span>
              <span id="valHunger">30 / 100</span>
            </div>
            <div class="metric-bar-bg">
              <div id="barHunger" class="metric-bar-fill hunger" style="width: 30%;"></div>
            </div>
          </div>

          <div class="metric-item">
            <div class="metric-header">
              <span>💕 행복도</span>
              <span id="valHappiness">70 / 100</span>
            </div>
            <div class="metric-bar-bg">
              <div id="barHappiness" class="metric-bar-fill happiness" style="width: 70%;"></div>
            </div>
          </div>

          <div class="metric-item">
            <div class="metric-header">
              <span>✨ 친밀도</span>
              <span id="valAffection">20 / 100</span>
            </div>
            <div class="metric-bar-bg">
              <div id="barAffection" class="metric-bar-fill affection" style="width: 20%;"></div>
            </div>
          </div>

          <div class="metric-item">
            <div class="metric-header">
              <span>⚡ 에너지</span>
              <span id="valEnergy">80 / 100</span>
            </div>
            <div class="metric-bar-bg">
              <div id="barEnergy" class="metric-bar-fill energy" style="width: 80%;"></div>
            </div>
          </div>

          <div class="metric-item">
            <div class="metric-header">
              <span>💢 스트레스</span>
              <span id="valStress">10 / 100</span>
            </div>
            <div class="metric-bar-bg">
              <div id="barStress" class="metric-bar-fill stress" style="width: 10%;"></div>
            </div>
          </div>
        </div>
      </div>
    </aside>

  </main>

  <!-- Room Decoration Drawer Modal -->
  <div id="drawerBackdrop" class="drawer-backdrop">
    <div class="drawer-content">
      <div class="drawer-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>🛋️ 방 꾸미기 슬롯</h2>
        <button id="btnCloseDrawer" class="header-action-btn">✕</button>
      </div>

      <div id="drawerSlotTabs" class="slot-tabs" style="display:flex; gap:6px; overflow-x:auto;">
        <!-- Dynamic Tabs -->
      </div>

      <div id="drawerItemsGrid" class="items-grid">
        <!-- Dynamic Item Cards -->
      </div>
    </div>
  </div>

  <!-- Onboarding Cat Naming Modal -->
  <div id="modalOnboardingBackdrop" class="modal-backdrop">
    <div class="modal-box">
      <h2>🐱 고양이의 이름을 정해 주세요!</h2>
      <p style="color:var(--text-muted); font-size:14px;">다마고치에 찾아온 귀여운 픽셀 고양이에게 특별한 이름을 선물하세요.</p>
      <input type="text" id="inputCatName" class="form-input" placeholder="고양이 이름 (예: 나비)" maxlength="12">
      <button id="btnSaveCatName" class="header-action-btn" style="justify-content:center; margin-top:8px; background:var(--primary-pink); color:#fff; border:none; padding:10px;">입력 완료</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
