<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NABI MEOW 🐱 Cat Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- ── App Header ── -->
  <header class="app-header">
    <div class="brand-container">
      <span class="brand-logo">🐾</span>
      <span class="brand-title">Cat Room</span>
      <span class="cat-name-badge" id="catNameBadge" title="클릭하여 이름 변경">나비</span>
    </div>
    <div class="header-actions">
      <button class="header-action-btn" id="btnOpenDecoration">🛋️ 방 꾸미기</button>
      <button class="header-action-btn" id="btnCaptureRoom">📸 사진 저장</button>
      <button class="header-action-btn" id="btnSerialConnect">
        <span class="status-dot disconnected" id="serialStatusDot"></span>
        <span id="serialBtnText">Arduino 연결</span>
      </button>
    </div>
  </header>

  <!-- ── 3-Column Dashboard ── -->
  <main class="dashboard-grid">

    <!-- Left: Virtual Sensors -->
    <aside class="sidebar-panel left-panel">
      <div class="panel-card">
        <div class="panel-title">🧪 가상 센서 테스트</div>
        <div class="virtual-grid">
          <button class="virtual-btn" id="vbtnFeed">🍽️ 밥 주기 (FEED)</button>
          <button class="virtual-btn" id="vbtnPetShort">🖐️ 짧게 만지기 (PET_SHORT)</button>
          <button class="virtual-btn" id="vbtnPetLong">💖 오래 쓰다듬기 (PET_LONG)</button>
          <button class="virtual-btn" id="vbtnSlowApproach">🐱 천천히 접근 (SLOW)</button>
          <button class="virtual-btn" id="vbtnFastApproach">⚡ 빠른 접근 (FAST)</button>
          <button class="virtual-btn" id="vbtnPersonLeft">👋 사람 떠남 (LEFT)</button>
          <button class="virtual-btn" id="vbtnLightBright">☀️ 낮 모드 (BRIGHT)</button>
          <button class="virtual-btn" id="vbtnLightDark">🌙 밤 모드 (DARK)</button>
        </div>
      </div>
    </aside>

    <!-- Center: Tamagotchi Shell -->
    <section class="center-tamagotchi-stage">
      <div class="tamagotchi-shell-3d">
        <div class="tamagotchi-heart-hook"></div>
        <div class="tamagotchi-title-text">나비's Room</div>

        <div class="tamagotchi-screen-frame">
          <div class="room-stage-container">
            <div class="speech-bubble-overlay" id="speechBubbleOverlay">
              💬 <span id="speechBubbleText">오늘도 잘 부탁해요! 냥♡</span>
            </div>
            <div id="roomCanvasContainer" style="width:100%;height:100%;"></div>
          </div>
        </div>

        <div class="tamagotchi-4buttons-row">
          <button class="shell-4btn feed"  id="btnShellFeed"  title="Feed">🍽️</button>
          <button class="shell-4btn pet"   id="btnShellPet"   title="Pet">🖐️</button>
          <button class="shell-4btn play"  id="btnShellPlay"  title="Play">🏀</button>
          <button class="shell-4btn sleep" id="btnShellSleep" title="Sleep">🌙</button>
        </div>
      </div>
    </section>

    <!-- Right: Live Metrics -->
    <aside class="sidebar-panel right-panel">
      <div class="panel-card">
        <div class="panel-title">
          <span>📊 실시간 고양이 상태</span>
          <span class="behavior-tag" id="catBehaviorTag">💬 평온함</span>
        </div>
        <div class="metrics-vertical-list">
          <div class="metric-item">
            <div class="metric-header"><span>🥣 포만감</span><span id="valHunger">80%</span></div>
            <div class="metric-bar-bg"><div class="metric-bar-fill hunger" id="barHunger" style="width:80%"></div></div>
          </div>
          <div class="metric-item">
            <div class="metric-header"><span>🙂 행복도</span><span id="valHappiness">70%</span></div>
            <div class="metric-bar-bg"><div class="metric-bar-fill happiness" id="barHappiness" style="width:70%"></div></div>
          </div>
          <div class="metric-item">
            <div class="metric-header"><span>💖 친밀도</span><span id="valAffection">90%</span></div>
            <div class="metric-bar-bg"><div class="metric-bar-fill affection" id="barAffection" style="width:90%"></div></div>
          </div>
          <div class="metric-item">
            <div class="metric-header"><span>⚡ 체력</span><span id="valEnergy">60%</span></div>
            <div class="metric-bar-bg"><div class="metric-bar-fill energy" id="barEnergy" style="width:60%"></div></div>
          </div>
          <div class="metric-item">
            <div class="metric-header"><span>🌧️ 스트레스</span><span id="valStress">20%</span></div>
            <div class="metric-bar-bg"><div class="metric-bar-fill stress" id="barStress" style="width:20%"></div></div>
          </div>
        </div>
      </div>
    </aside>

  </main>

  <!-- ── Bottom Drawer (Catalog Grid) ── -->
  <div class="decoration-drawer" id="decorationDrawer">
    <div class="drawer-header">
      <h3 class="drawer-title">✨ NABI MEOW CATALOG</h3>
      <button class="drawer-close-btn" id="btnCloseDrawer">✕</button>
    </div>

    <!-- Category Tabs -->
    <div class="drawer-tabs" id="drawerTabs">
      <button class="drawer-tab active" data-slot="wallpaper">🎨 벽지</button>
      <button class="drawer-tab" data-slot="floor">🪵 바닥</button>
      <button class="drawer-tab" data-slot="bed">🛏️ 침대</button>
      <button class="drawer-tab" data-slot="bowl">🥣 밥그릇</button>
      <button class="drawer-tab" data-slot="catTower">🐾 캣타워</button>
      <button class="drawer-tab" data-slot="cushion">🐟 쿠션</button>
      <button class="drawer-tab" data-slot="toy">🧶 장난감</button>
      <button class="drawer-tab" data-slot="window">🪟 창문</button>
      <button class="drawer-tab" data-slot="wallDecor">🖼️ 벽장식</button>
    </div>

    <!-- 3-Column Catalog Grid -->
    <div class="catalog-grid" id="catalogGrid"></div>
  </div>

  <!-- ── Onboarding Modal ── -->
  <div class="modal-backdrop hidden" id="onboardingModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-icon">🐾</span>
        <h2>새로운 아기 고양이 맞이하기</h2>
      </div>
      <p class="modal-desc">
        다마고치 룸에 오신 것을 환영합니다!<br>
        함께 보살필 귀여운 고양이의 이름을 지어주세요.
      </p>
      <div class="modal-input-group">
        <label for="catNameInput">고양이 이름</label>
        <input type="text" id="catNameInput" placeholder="예: 나비, 야옹이, 럭키" maxlength="10" value="나비">
      </div>
      <button class="modal-submit-btn" id="btnSaveCatName">시작하기 💕</button>
    </div>
  </div>

  <!-- ── Toast Container ── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JS Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
